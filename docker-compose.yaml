services:
  
  frontend:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:Z
    networks:
      - frontend-net
    depends_on:
      - backend


  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://app:secret@database:5432/myapp
    
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - database
        

    healthcheck:
      test: ["CMD", "wget" , "-q" , "-O-" , "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

    
  database:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=myapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:Z

    networks:
      - backend-net

    healthcheck:
      test: ["CMD-SHELL", "ps_isready -U app -d myapp"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    
      
volumes:
  postgres-data:

networks:
  frontend-net:
  backend-net:
